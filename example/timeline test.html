<style>
  @keyframes drift {
    0%, 100% { transform: translateY(0) translateX(0); }
    25% { transform: translateY(-20px) translateX(10px); }
    50% { transform: translateY(-10px) translateX(20px); }

  .animate-drift {
    animation: drift 15s ease-in-out infinite;

  .animate-drift-slow {
    animation: drift 25s ease-in-out infinite;

  .animate-drift-reverse {

<script>
  (function() {
    // Time Picker Logic
    const toggle = document.getElementById('time-picker-toggle');
    const dropdown = document.getElementById('time-picker-dropdown');
    if (toggle && dropdown) {
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && e.target !== toggle) {
          dropdown.classList.add('hidden');
        }
      });
    }

    // Zoom & Pan Logic
    const container = document.getElementById('zoom-container');
    const mainCanvas = document.getElementById('main-canvas');
    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 3;

    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // Zoom Buttons
    document.getElementById('zoom-in').addEventListener('click', () => {
      scale = Math.min(scale + 0.2, MAX_SCALE);
      updateTransform();
    });
    
    document.getElementById('zoom-out').addEventListener('click', () => {
      scale = Math.max(scale - 0.2, MIN_SCALE);
      updateTransform();
    });
    
    document.getElementById('zoom-reset').addEventListener('click', () => {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    });

    // Pan with Mouse
    mainCanvas.addEventListener('mousedown', (e) => {
      // Don't pan if clicking input elements or buttons
      if (e.target.closest('input, button, #time-picker-dropdown')) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Touch/Pinch to Zoom & Pan
    let initialDistance = null;
    let initialScale = 1;

    mainCanvas.addEventListener('touchstart', (e) => {
      if (e.target.closest('input, button, #time-picker-dropdown')) return;
      
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, {passive: false});

    mainCanvas.addEventListener('touchmove', (e) => {
      if (e.target.closest('input, button, #time-picker-dropdown')) return;
      e.preventDefault(); // Prevent scrolling while panning

      if (e.touches.length === 1 && isDragging) {
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialDistance !== null) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        
        const delta = currentDistance / initialDistance;
        scale = Math.min(Math.max(initialScale * delta, MIN_SCALE), MAX_SCALE);
        updateTransform();
      }
    }, {passive: false});

    mainCanvas.addEventListener('touchend', () => {
      isDragging = false;
      initialDistance = null;
    });

    // Mouse Wheel Zoom
    mainCanvas.addEventListener('wheel', (e) => {
      if (e.target.closest('#time-picker-dropdown')) return;
      e.preventDefault();
      const zoomSensitivity = 0.001;
      const delta = -e.deltaY * zoomSensitivity;
      const newScale = Math.min(Math.max(scale + delta, MIN_SCALE), MAX_SCALE);
      
      // Calculate origin for zooming to mouse position (simplified for center origin)
      scale = newScale;
      updateTransform();
    }, {passive: false});


    // Particle System
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.01;
        // Match the cyan/blue theme
        this.color = `rgba(0, 227, 253, ${this.life})`; 
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
        this.color = `rgba(0, 227, 253, ${this.life * 0.5})`; // Soften opacity
        this.size = Math.max(0, this.size - 0.05);
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(0, 227, 253, 0.8)';
        ctx.fill();
      }
    }

    function handleParticles() {
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0 || particles[i].size <= 0) {
          particles.splice(i, 1);
          i--;
        }
      }
    }

    function createParticles(x, y) {
      if (Math.random() > 0.5) { // Throttle slightly
        particles.push(new Particle(x, y));
      }
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
      createParticles(mouse.x, mouse.y);
    });

    window.addEventListener('touchmove', (e) => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      createParticles(mouse.x, mouse.y);
    });

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      handleParticles();
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

  })();
</script></body></html>
